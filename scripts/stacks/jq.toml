ext = "jq"
test_glob = "*.json"
name_regex = "[A-Za-z0-9_-]+\\.json"
test_runner = "jq empty"
smoke_runner = "jq empty"
preflight = "command -v jq"
domains = []
runtime = ["jq"]
# CC-151: `jq empty` has no config file that rewrites its verdict.
verdict_config = []
# CC-150: the jq stack has no top-level bootstrap file.
bootstrap_paths = []

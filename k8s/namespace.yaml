# PSA (SPEC-PSA-2026-10-14): Pod Security Admission labels for the namespace
# the stanok Jobs run in (default; STANOK_K8S_NAMESPACE). k3s v1.36.5 -> PSA
# GA, profile version v1.36 (current). Both stanok Pods already satisfy
# `restricted` (worker-job.yaml.tmpl / fresh-job.yaml.tmpl; pinned by
# launcher/tests_harness/test_k8s_manifests.py) — this manifest makes the
# cluster enforce it at admission instead of relying on template discipline.
# Stage 1 (host-side, 2026-10-14): warn/audit; dry-run of BOTH Pods passed
# with zero warnings, negative control fired. Stage 2 (operator action,
# 2026-10-14): enforce: restricted applied to the live namespace
# (`kubectl label ... --overwrite`); both Pods re-verified under enforce
# (dry-run clean, negative control Forbidden). The test pins all three labels.
apiVersion: v1
kind: Namespace
metadata:
  name: default
  labels:
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted

# P1 (SPEC-STANOK-K8S-RUNTIME-2026-10-10 §7) — the network boundary that
# REPLACES the Docker-era stanok-net iptables policy and the bwrap network
# block (O3). Apply once per namespace; the policies select Pods by label,
# the Jobs carry the labels.
#
# Worker: egress ONLY to kube-dns (53), the model host 192.168.8.131
# (8080 — the inference server) and the Opik backend on the cluster node
# host 192.168.122.156 (8080 — the OTLP tracing target, CC-225; the
# backend is published 0.0.0.0:8080 on the node, reachable from Pods via
# the node LAN IP). Everything else is refused: packages from the internet
# are NOT installable, exactly as in the Docker era.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stanok-worker-egress
  namespace: default
spec:
  podSelector:
    matchLabels:
      stanok: worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 192.168.8.131/32
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - ipBlock:
            cidr: 192.168.122.156/32
      ports:
        - protocol: TCP
          port: 8080
---
# Fresh (the host's independent verifier Pod): DENY-ALL egress — policyTypes
# Egress with NO egress rules. The check must not reach the model server or
# anything else (the mirror of the Docker fresh container's --network=none).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stanok-fresh-deny-all
  namespace: default
spec:
  podSelector:
    matchLabels:
      stanok: fresh
  policyTypes:
    - Egress

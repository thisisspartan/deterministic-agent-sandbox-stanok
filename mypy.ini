# mypy gate (T2, 2026-10-20 — operator-ordered ruff/mypy wave).
# Scope: launcher production code (the host infrastructure flagged for type
# debt by the 2026-10-20 external review). Not checked on purpose:
#   launcher/tests_harness — the host test suite, validated by pytest itself;
#   src/ — empty; machine-written code is contract-tested via run.sh, not
#         annotated, and a mypy gate there would gate the machine, not the host.
# Version pinned by the CI lint job (kept equal to the local tool).
[mypy]
python_version = 3.11
files = launcher
exclude = launcher/tests_harness

# Q14 (2026-10-21 review wave) — incremental strict migration: strict-class
# checking is enabled per module, module by module, so each migrated module
# is gated green from its migration commit onward and the remaining debt
# (measured 2026-10-21: 213 strict-class errors in 12 launcher files;
# after wave 2: 162 in 5 files — k8s 58, session 47, cli 23, summary 17,
# gates 17; k8s.py/session.py deliberately untouched — R6/T3 HOLD) stays
# visible but cannot regress the migrated set.
# Migration order = fewest strict errors first. Migrated (2026-10-21):
#   wave 1: launcher.opik (2), launcher.netpol (3), launcher.ci_skips (6),
#   launcher.ticket (6) — plus the one arg-type this migration surfaced in
#   launcher/ticketcheck.py (a SimpleNamespace cfg passed to
#   parse_ticket_header; resolved by ticket.py declaring the structural
#   TicketConfig Protocol it actually needs, not the concrete Config).
#   wave 2: launcher.pod_runner (9), launcher.verify (12), launcher.aggregate (12).
#   wave 3 (2026-10-21, wave B→D→A, D): launcher.gates (17), launcher.summary (17).
#   wave A step 1 (2026-10-21, k8s split, agreed T3 sequence): launcher.abort —
#   new leaf module extracted from cli._early_abort, strict-class from birth.
#   wave A portion 2 (2026-10-21, k8s split): launcher.kube — the cluster-facing
#   layer (render_template/_read_manifest + kubectl plumbing) moved verbatim from
#   k8s.py; strict from birth because launcher.netpol (already strict) is a direct
#   consumer of render_template/_namespace/_read_manifest — strict callers require
#   annotated callees (the precedent recorded above for the cli.py:774 boundary).
#   The moved functions carried zero strict debt, so this shrinks the k8s count.
#   wave A portion 5 (2026-10-21, k8s split): launcher.peaks — the resource-
#   sampling cluster (SAMPLE_INTERVAL_S, _node_of_pod, _kubelet_stats,
#   _peak_from_stats, the _ResourceSampler class) moved verbatim from k8s.py;
#   strict from birth: the bare `dict`/unannotated signatures were the k8s
#   strict-class debt, so they are annotated AT move time (dict[str, Any],
#   the fetch hook Callable[[], dict[str, Any]] | None); bodies unchanged
#   except the json.loads result bound to an annotated local (gates.py
#   pattern).
#   wave A portion 6 (2026-10-21, k8s split): launcher.lifecycle — the Pod/Job
#   observation cluster (_pod_of_job, _pod_image_id, _stream_pod_logs,
#   _job_rc_and_tail, _pod_infra_cause, _job_infra_cause, _wait_job_terminal),
#   the two post-deadline graces (_STREAM_GRACE_S, _TERMINAL_GRACE_S) and the
#   shared-end window calculator (_observation_timeout) moved verbatim from
#   k8s.py; strict from birth: the missing return annotations, unannotated pod
#   params and the bare `tuple` were latent k8s strict-class debt, annotated AT
#   move time; bodies unchanged except two typed locals in _wait_job_terminal
#   (the json.loads result and the Job condition type — the gates.py pattern).
#   What stays in k8s is the Job CONSTRUCTION policy the observation windows
#   are measured against: _DEADLINE_MARGIN_S and job_deadline (activeDeadline
#   Seconds belongs to Job creation; pinned directly by test_k8s_manifests),
#   _fresh_job and _image_ref (fresh-check and image transport). test_timer_
#   contract legitimately spans both homes (k8s.job_deadline + lifecycle graces).
#   wave A portion 4 (2026-10-21, k8s split): launcher.patchgate — the patch
#   verification cluster (zone gate + its helpers, the identity trio, the eight
#   regex/prefix constants they resolve through module globals) moved verbatim
#   from k8s.py; strict from birth: the bare `list` signatures were the k8s
#   strict-class debt, so they are annotated AT move time (list[str]); bodies
#   unchanged. The scratch cluster (apply_patch_scratch/
#   scratch_contract_violations) and _live_tree_drift stay in k8s — transport/
#   contract machinery (unpack_tree, verify._compare_manifests,
#   gates.dirty_tree_gate) of a later portion.
#   wave A portion 3 (2026-10-21, k8s split): launcher.preflight — the unified
#   launch gate and the CC-232 cluster gate moved verbatim from k8s.py; the
#   runtime-class knob (_runtime_class_name/_runtime_class) moved to launcher.kube
#   (its two consumers, the render dicts and the preflight check, reach it as
#   kube._X). strict from birth: the moved functions were the k8s strict-class
#   debt, so they are annotated AT move time (cfg: "Config" via TYPE_CHECKING —
#   the gates.py house style) — the k8s count shrinks, nothing is relocated.
#   strict remainder (S1, 2026-10-21, operator-ordered "strict remainder
#   session/k8s/cli"): launcher.session (46) — annotations only, no behavior
#   change; the recorded "fewest errors first" order is overridden here by
#   the boundary dependency k8s.py imports session._install_signal_handlers:
#   annotating host_launch_k8s would create a no-untyped-call against it, so
#   the real order is session -> k8s -> cli. Two real-code changes were the
#   exception, each forced by a typed boundary, behavior identical:
#     - _agent_options tools=/allowed_tools=: the SDK fields are list[str],
#       Config holds a frozen tuple — list() conversion at the call site.
#     - _resolve_hook_target: an isinstance(fp, str) guard mirroring
#       _test_write_kind (the old crash path was already a caught no-op).
#   Plus one boundary-type fix in launcher/ticket.py: the TicketConfig
#   Protocol member `repo_root: str` (a SETTABLE-attribute requirement) does
#   not structurally accept the frozen Config — the contradiction only
#   appeared once a strict call site (session.py) passed Config. Restated as
#   the read-only @property accessor it actually needs; the docstring claim
#   "Config satisfies this structurally" is now true at the checker too.
#   S2 (2026-10-21, "strict remainder" continued): launcher.k8s (16) —
#   annotations only at the untyped sites (transport build/extract,
#   _live_tree_drift, scratch_contract_violations, stamp_opik_traces,
#   job_deadline, _fresh_job, _image_ref, host_launch_k8s incl. its
#   args: argparse.Namespace via the TYPE_CHECKING import — the caller
#   cli.cmd_run passes exactly that). The one real-code change is forced
#   by a typed boundary, behavior identical: the image-delivery guard
#   tests `image_ref is None` instead of `image_err` — _image_ref's
#   documented pairing (ref None ⟺ reason non-None; every test stub
#   honors it) makes this the same branch, and it narrows image_ref to
#   str for the worker/fresh Job renders. _image_ref's json.loads result
#   bound to an annotated local (the gates.py pattern, as in peaks/
#   lifecycle).
#   S3 (2026-10-21, closes the "strict remainder"): launcher.cli (22) —
#   annotations only, zero real-code changes: cmd_*/gate/launch helpers
#   take cfg: Config (runtime import) and args: argparse.Namespace (the
#   runtime argparse import; Namespace's __getattr__/__setattr__ stubs
#   keep its attributes Any — the defensive args.ticket_path set/get
#   design is preserved, not tightened), the job dicts are dict[str, Any]
#   (write_summary's declared parameter), the ticket-contract/argv/status
#   tuples fully spelled. The boundaries it waits on (k8s.host_launch_k8s,
#   run_continuous_session, _install_signal_handlers) were typed by S1/S2.
#   STRICT REMAINDER CLOSED (2026-10-21): the measured 84 strict-class
#   errors in session(47->46)/k8s(58->16)/cli(23->22) — the last three
#   files with debt — are 0; every file the measurement flagged is in the
#   strict section.
#   GATE COMPLETE (2026-10-21, operator decision "пуш и гейт"): the last five
#   launcher files (launcher.config, launcher.exitcodes, launcher.logs,
#   launcher.plan, launcher.stanok) were measured debt-free in the strict-
#   remainder profiling (zero errors under the full strict profile over the
#   whole launcher), and are now in the strict section per the operator's
#   decision. No annotations were needed; no file was changed by this step
#   except mypy.ini itself. Every launcher production file is now strict-gated.
#   #316 (2026-10-22, k8s split, layer finding of the 2026-10-22 pre-flight
#   review): launcher.payload — the transport/codec cluster (the four constants
#   and new_nonce/begin_marker/end_marker/pack_tree/unpack_tree/transport_ok/
#   build_payload/_bounded_gunzip/extract_payload/rewrite_tracing_endpoint)
#   moved verbatim from k8s.py; zero strict debt (the S2 pass had already
#   annotated exactly these transport build/extract sites), strict from birth:
#   the new consumer pod_runner.py imports it directly (already strict) and
#   payload is a pure-stdlib leaf, strict callers require annotated callees —
#   the wave-A precedent. The host evidence stamps (stamp_opik_traces,
#   _stamp_summary_identity, _stamp_resource_peaks) moved to launcher.summary
#   (already strict); pod_runner.py retargeted to import launcher.payload
#   directly — the 1159-line host orchestrator no longer enters the Pod
#   runtime. Guard: tests_harness/test_payload_facade.py.
# The flags below are exactly mypy 2.2.0's strict_flag_assignments (the set
# `strict = True` applies; extracted from .venv mypy/main.py define_options).
# They are spelled out per-module because `strict = True` in a [mypy-...]
# section is NOT scoped in this version: config parsing applies the strict
# flags to the whole run (verified 2026-10-21 on a minimal pair: a dirty
# module was flagged by a section naming only the clean module; the explicit
# flags in the same section scope correctly). warn_redundant_casts is
# omitted here: mypy rejects it in per-module sections (global-only) — it is
# a global flag and belongs to a future global-strict step, not to this list.
[mypy-launcher.abort,launcher.gates,launcher.summary,launcher.payload,launcher.pod_runner,launcher.verify,launcher.aggregate,launcher.opik,launcher.netpol,launcher.ci_skips,launcher.ticket,launcher.kube,launcher.preflight,launcher.patchgate,launcher.peaks,launcher.lifecycle,launcher.session,launcher.k8s,launcher.cli,launcher.config,launcher.exitcodes,launcher.logs,launcher.plan,launcher.stanok]
check_untyped_defs = True
disallow_any_generics = True
disallow_incomplete_defs = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_untyped_defs = True
extra_checks = True
strict_equality = True
warn_return_any = True
warn_unused_ignores = True

[mypy-claude_agent_sdk.*]
# The SDK ships in the Pod image (image-requirements.lock) but not in the host
# venv (harness tests importorskip it). Import resolution is suppressed here;
# where the SDK is present (CI/Pod) its real types are used.
ignore_missing_imports = True
